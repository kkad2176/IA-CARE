- categorie: "Anti-Vitamine K (AVK)"
  source_ref: "regle_10_avk"
  source_url:
    - "https://sfar.org/wp-content/uploads/2026/04/RFE-20.4.2026-deifinitif-et-validei.pdf"
    - "https://www.has-sante.fr/upload/docs/application/pdf/2008-09/surdosage_en_avk_situations_a_risque_et_accidents_hemorragiques_-_synthese_des_recommandations_v2.pdf"
    - "https://sfar.org/wp-content/uploads/2015/10/2_HAS_Prise-en-charge-des-surdosages-en-antivitamines-K.pdf"
    - "https://www.sfed.org/wp-content/uploads/2023/05/hpg-330477-61316-gestion_des_antiagregants_et_anticoagulants_en_endoscopie_document_sfed_2023_a_partir_des_recommandations_bsg_esge_2021_-318879-u-e1d.pdf"
    - "https://inavalverhd.inaheart.org/wp-content/uploads/2025/09/2025-ESC-EACTS-Guidelines-for-the-Management-of-Valvular-Heart-Disease.pdf"
    - "https://pure.eur.nl/ws/portalfiles/portal/182889750/2024_ESC_Guidelines_for_the_management_of_atrial_fibrillation_developed_in_collaboration_with_the_European_Association_for_Cardio-Thoracic_Surgery_EACTS_.pdf"

  atc_prefix:
    - "B01AA"

  conditions:

    # =====  NEUROCHIRURGIE =====
    - if:
        type_chir_neuro: "NEUROCHIR_INTRACRANIENNE"
      action: "ARRET"
      jour: "J-5"
      note: |
        Arrêt AVK à J-5 pour tous les AVK.
        Pas de relais systématique.
        Contrôle INR initial entre J-10 et J-7.
        Objectif le matin de l’intervention : INR < 1.2.
       

    # =====  CHIRURGIE À FAIBLE RISQUE + INR CONNU EN ZONE =====
    - if:
        r_hem: ["FAIBLE", "NUL"]
        inr_therapeutique_2_3: true
      action: "POURSUITE"
      jour: "J0"
      note: |
        Chirurgie à risque hémorragique faible : poursuite possible si INR entre 2 et 3.
        Contrôle INR initial entre J-10 et J-7.
        

    # ===== CHIRURGIE À FAIBLE RISQUE + INR CONNU HORS ZONE =====
    - if:
        r_hem: ["FAIBLE", "NUL"]
        inr_hors_zone_2_3: true
      action: "AVIS_SPECIALISE"
      jour: "J0"
      note: |
        Chirurgie à risque hémorragique faible mais INR hors zone thérapeutique attendue (2 à 3).
        Vérifier l’indication, la cible INR et discuter la conduite à tenir.
        
    # ===== CHIRURGIE À FAIBLE RISQUE + INR NON CONNU =====
    - if:
        r_hem: ["FAIBLE", "NUL"]
        inr_non_connu: true
      action: "POURSUITE"
      jour: "J0"
      note: |
        Chirurgie à risque hémorragique faible : poursuite possible si INR entre 2 et 3.
        Contrôle INR initial entre J-10 et J-7. 
        


    # ===== RELAI AVK Selon LE DFG =====
    - if:
        relais_avk: true
        dfg_relais_avk: "DFG > 30"
      action: "ARRET + RELAI"
      jour: "J-6"
      note: |
        Risque hémorragique élevé. Contrôle initial de l’INR (J -10 à J -7) pour vérifier si en zone thérapeutique.
        Si Warfarine alors dernière prise J-6.

        Si DFG > 30 alors :
        HBPM SC à dose curative en 2 injections par jour avec 1ère injection le soir de J-3 et dernière injection au plus tard le matin de J-1.
        Si relais par HBPM SC en 1 injection par jour, alors dernière injection à J-2.
        

    - if:
        relais_avk: true
        dfg_relais_avk: "15 ≤ DFG < 30"
      action: "ARRET + RELAI"
      jour: "J-5"
      note: |
        Si DFG entre 15 et 29 alors plusieurs schémas possibles : 

        -Enoxaparine 100 UI/kg x 1/j avec la 1ère injection le soir de J-3 et la dernière injection le soir de J-2 (soit 2 injections au total)

        -Tinzaparine 175 UI/kg x 1/j avec la 1ère injection le soir de J-3 et la dernière injection le soir de J-2 (soit 2 injections au total)

        -HNF calcique SC (adaptée au poids sans surveillance biologique) avec 1ère injection à 333 UI/kg le soir de J-3, puis 250 UI/Kg toutes les 12h avec une dernière injection le matin de J-1

        -HNF IVSE le soir de J-3 et arrêtée 6h avant l’intervention

        
    - if:
        relais_avk: true
        dfg_relais_avk: "DFG < 15"
      action: "ARRET + RELAI"
      jour: "J-5"
      note: |
        Si DFG < 15 alors plusieurs schémas possibles :

        -Tinzaparine 175 UI/kg x 1/j avec la 1ère injection le soir de J-3 et la dernière injection le soir de J-2 (soit 2 injections au total)

        -HNF calcique SC (adaptée au poids sans surveillance biologique) avec 1ère injection à 333 UI/kg le soir de J-3, puis 250 UI/Kg toutes les 12h avec une dernière injection le matin de J-1

        -HNF IVSE le soir de J-3 et arrêtée 6h avant l’intervention

        

    - if:
        relais_avk: true
        dfg_relais_avk: "DFG inconnu"
      action: "INFO"
      jour: ""
      note: |
        DFG inconnu : vérifier la fonction rénale avant de choisir le schéma de relai AVK.

        


    # ================RISQUE HÉMORRAGIQUE ÉLEVÉ
    - if:
        r_hem: ["ELEVE", "IMPORTANT", "MAJEUR"]
        atc_codes: ["B01AA03"]
      action: "ARRET"
      jour: "J-6"
      note: |
        Risque hémorragique élevé. Contrôle initial de l’INR (J -10 à J -7) pour vérifier si en zone thérapeutique.
        Si Warfarine alors dernière prise J-6.
        

    - if:
        r_hem: ["ELEVE", "IMPORTANT", "MAJEUR"]
        atc_codes: ["B01AA12"]
      action: "ARRET"
      jour: "J-5"
      note: |
        Risque hémorragique élevé.
        Contrôle initial de l’INR (J -10 à J -7) pour vérifier si en zone thérapeutique
        Si Fluindione alors dernière prise J-5.
       
    - if:
        r_hem: ["ELEVE", "IMPORTANT", "MAJEUR"]
        atc_codes: ["B01AA07"]
      action: "ARRET"
      jour: "J-4"
      note: |
        Risque hémorragique élevé.
        Contrôle initial de l’INR (J -10 à J -7) pour vérifier si en zone thérapeutique
        Si Acénocoumarol alors dernière prise J-4.
       
  
    # ===== PAR DÉFAUT =====
    - default: true
      action: "ARRET"
      jour: "J-5"
      note: |
        Arrêt AVK à J-5 pour tous les AVK.
        Pas de relais systématique.
        Contrôle INR initial entre J-10 et J-7.
        Contrôle INR la veille ou matin de l'intervention.






