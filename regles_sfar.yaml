- categorie: "Anti-Vitamine K (AVK)"
  source_ref: "regle_10_avk"
  source_url:
    - "https://sfar.org/wp-content/uploads/2026/04/RFE-20.4.2026-deifinitif-et-validei.pdf"
    - "https://www.has-sante.fr/upload/docs/application/pdf/2008-09/surdosage_en_avk_situations_a_risque_et_accidents_hemorragiques_-_synthese_des_recommandations_v2.pdf"
    - "https://sfar.org/wp-content/uploads/2015/10/2_HAS_Prise-en-charge-des-surdosages-en-antivitamines-K.pdf"
    - "https://www.sfed.org/wp-content/uploads/2023/05/hpg-330477-61316-gestion_des_antiagregants_et_anticoagulants_en_endoscopie_document_sfed_2023_a_partir_des_recommandations_bsg_esge_2021_-318879-u-e1d.pdf"
    - "https://inavalverhd.inaheart.org/wp-content/uploads/2025/09/2025-ESC-EACTS-Guidelines-for-the-Management-of-Valvular-Heart-Disease.pdf"
    - "https://pure.eur.nl/ws/portalfiles/portal/182889750/2024_ESC_Guidelines_for_the_management_of_atrial_fibrillation_developed_in_collaboration_with_the_European_Association_for_Cardio-Thoracic_Surgery_EACTS_.pdf"



  atc_prefix:
    - "B01AA"

  conditions:

    # =====================================================
    # LVAD 
    # =======================================================

    - if:
        indication_avk: "LVAD"
        r_hem: ["ELEVE", "IMPORTANT", "MAJEUR"]
        lvad_reprise_24_48h: true
      action: "POURSUITE AVK + CCP"
      jour: "J0"
      note: |
        Ne pas interrompre l’AVK. Au moment de la procédure, antagoniser temporairement avec des concentrés de complexe prothrombinique (CCP) seuls, sans vitamine K, selon l’INR, avec objectif INR < 1,5 (dose moyenne indicative : environ 20 UI/kg). Reprendre l’AVK le soir de la procédure à la dose habituelle, sans relais héparinique. Contrôler l’INR quotidiennement jusqu’au retour dans la cible 2-3.

    - if:
        indication_avk: "LVAD"
        r_hem: ["ELEVE", "IMPORTANT", "MAJEUR"]
        lvad_reprise_24_48h: false
      action: "ARRET + RELAI"
      jour: "Selon molécule"
      note: |
        Arrêter l’AVK et réaliser un relais pré-procédural par HBPM à dose curative : première injection soir J-3 ; dernière injection au plus tard matin J-1 ; pas de contrôle anti-Xa systématique le matin de l’intervention. Reprendre l’AVK dans les 24 premières heures et ne pas réaliser de relais héparinique curatif postopératoire.


    # =========================================
    # RISQUE HEMORRAGIQUE FAIBLE
    # ========================================


    # RISQUE FAIBLE AVEC FACTEUR HEMORRAGIQUE SUP
    - if:
        r_hem: ["FAIBLE", "NUL"]
        facteur_hemorragique_supplementaire: true
      action: "REEVALUATION MEDICALE"
      jour: ""
      note: |
        Réévaluation médicale nécessaire : un facteur supplémentaire peut conduire à interrompre l’anticoagulant.



    - if:
        r_hem: ["FAIBLE", "NUL"]
        facteur_hemorragique_supplementaire: false
      action: "POURSUITE"
      jour: "J0"
      note: |
        Poursuivre l’AVK. Contrôler l’INR dans la semaine précédant la procédure pour vérifier l’absence de surdosage. Après la procédure poursuivre/reprendre l’AVK à l’heure et à la posologie habituelles.




    
    # RISQUE HEMORRAGIQUE ELEVE

    # WARFARINE
    - if:
        r_hem: ["ELEVE", "IMPORTANT", "MAJEUR"]
        atc_codes: ["B01AA03"]
        lvad_sans_arret_avk: false
      action: "ARRET"
      jour: "J-6"
      note: |
        Dernière prise de warfarine à J-6. Contrôler l’INR à J-1.

    # FLUINDIONE
    - if:
        r_hem: ["ELEVE", "IMPORTANT", "MAJEUR"]
        atc_codes: ["B01AA12"]
        lvad_sans_arret_avk: false
      action: "ARRET"
      jour: "J-5"
      note: |
        Dernière prise de fluindione à J-5. Contrôler l’INR à J-1.

    # ACENOCOUMAROL
    - if:
        r_hem: ["ELEVE", "IMPORTANT", "MAJEUR"]
        atc_codes: ["B01AA07"]
        lvad_sans_arret_avk: false
      action: "ARRET"
      jour: "J-4"
      note: |
        Dernière prise d’acénocoumarol à J-4. Contrôler l’INR à J-1.


  
    # INR J-1

    - if:
        r_hem: ["ELEVE", "IMPORTANT", "MAJEUR"]
        neuro_ou_neuraxial: false
        lvad_sans_arret_avk: false
      action: "CONTROLE INR"
      jour: "J-1"
      note: |
        Le seuil de sécurité hémostatique à J-1 est INR ≤ 1,5.

    - if:
        neuro_ou_neuraxial: true
      action: "CONTROLE INR"
      jour: "J-1"
      note: |
        Le seuil de sécurité hémostatique est INR ≤ 1,2.

    - if:
        inr_sup_seuil_avk: true
        lvad_sans_arret_avk: false
      action: "VITAMINE K"
      jour: "J-1"
      note: |
        Administrer 2 à 5 mg de vitamine K par voie orale à J-1 et contrôler l’INR le lendemain.


    #######################
    #########FA#####################

    - if:
        indication_avk: "FA"
        r_hem: ["ELEVE", "IMPORTANT", "MAJEUR"]
        acfa_atcd: false
      action: "PAS DE RELAIS"
      jour: ""
      note: |
        Ne pas réaliser de relais héparinique pré-procédural lors de l’arrêt des AVK.

    - if:
        indication_avk: "FA"
        r_hem: ["ELEVE", "IMPORTANT", "MAJEUR"]
        acfa_atcd: true
      action: "RELAIS PREOPERATOIRE"
      jour: "J-3"
      note: |
        Un relais héparinique pré-procédural à dose curative est indiqué.

    - if:
        indication_avk: "FA"
        fa_avc_moins_3_mois: true
        procedure_differable: true
      action: "DIFFERER PROCEDURE"
      jour: ""
      note: |
        Proposer de différer la procédure au minimum au-delà du 3e mois suivant l’AVC.

    - if:
        indication_avk: "FA"
        reprise_avk_24h: true
      action: "REPRISE AVK"
      jour: "J0 / J1"
      note: |
        Reprendre l’AVK dans les 24 premières heures à la posologie habituelle, sans dose de charge.

    - if:
        indication_avk: "FA"
        reprise_avk_24h: false
      action: "RELAIS POSTOPERATOIRE"
      jour: "H48-H72"
      note: |
        Initier une anticoagulation par héparine à dose curative, HBPM de préférence à HNF, idéalement 48 à 72 h après la procédure.


    # ================================================
    # VALVE mecanique
    # ==============================================

    - if:
        indication_avk: "VALVE_MECANIQUE"
        r_hem: ["ELEVE", "IMPORTANT", "MAJEUR"]
      action: "RELAIS PREOPERATOIRE"
      jour: "J-3"
      note: |
        Un relais héparinique pré-procédural à dose curative est indiqué.

    - if:
        indication_avk: "VALVE_MECANIQUE"
        r_hem: ["ELEVE", "IMPORTANT", "MAJEUR"]
      action: "INFO"
      jour: ""
      note: |
        Si possible, programmer la procédure le matin afin de ne pas prolonger l’arrêt des anticoagulants.

    - if:
        indication_avk: "VALVE_MECANIQUE"
        reprise_avk_24h: true
      action: "REPRISE AVK"
      jour: "J0 / J1"
      note: |
        Reprendre l’AVK dans les 24 premières heures à la posologie habituelle, sans dose de charge.

    - if:
        indication_avk: "VALVE_MECANIQUE"
        valve_aortique_double_ailette: true
        rythme_sinusal: true
        atcd_thrombotique_valve: false
        reprise_avk_24h: true
      action: "PAS DE RELAIS POSTOPERATOIRE"
      jour: ""
      note: |
        Ne pas réaliser de relais héparinique curatif postopératoire.

   
    - if:
        indication_avk: "VALVE_MECANIQUE"
        valve_aortique_double_ailette: false
      action: "RELAIS POSTOPERATOIRE"
      jour: "H48-H72"
      note: |
        Réaliser un relais postopératoire par héparine à dose curative, HBPM en 2 injections/j de   préférence à HNF, débuté idéalement 48 à 72 h après la procédure. Arrêter l’héparine dès le premier INR ≥ 2.

    - if:
        indication_avk: "VALVE_MECANIQUE"
        valve_aortique_double_ailette: true
        rythme_sinusal: false
      action: "RELAIS POSTOPERATOIRE"
      jour: "H48-H72"
      note: |
        Réaliser un relais postopératoire par héparine à dose curative, HBPM en 2 injections/j de préférence à HNF, débuté idéalement 48 à 72 h après la procédure. Arrêter l’héparine dès le premier INR ≥ 2.

    - if:
        indication_avk: "VALVE_MECANIQUE"
        valve_aortique_double_ailette: true
        rythme_sinusal: true
        atcd_thrombotique_valve: true
      action: "RELAIS POSTOPERATOIRE"
      jour: "H48-H72"
      note: |
        Réaliser un relais postopératoire par héparine à dose curative, HBPM en 2 injections/j de  préférence à HNF, débuté idéalement 48 à 72 h après la procédure. Arrêter l’héparine dès le premier INR ≥ 2.




    # =======================
    # MTEV
    # ================================

    - if:
        indication_avk: "MTEV"
        mtev_complexe: true
        r_hem: ["ELEVE", "IMPORTANT", "MAJEUR"]
      action: "AVIS_SPECIALISE"
      jour: ""
      note: |
        Cas complexe : contacter le médecin référent et discussion multidisciplinaire pour stratégie personnalisée.

    - if:
        indication_avk: "MTEV"
        mtev_complexe: false
        mtev_haut_risque: true
        procedure_differable: true
      action: "DIFFERER PROCEDURE"
      jour: ""
      note: |
        Proposer de différer la procédure au minimum au-delà du 1er mois et de préférence au-delà du 3ième mois.

    - if:
        indication_avk: "MTEV"
        mtev_complexe: false
        mtev_moins_1_mois: true
        procedure_differable: false
        r_hem: ["ELEVE", "IMPORTANT", "MAJEUR"]
      action: "DISCUSSION MEDICALE"
      jour: ""
      note: |
        Discuter la mise en place pré-procédurale d’un filtre cave optionnel.

    - if:
        indication_avk: "MTEV"
        mtev_complexe: false
        mtev_haut_risque: true
        r_hem: ["ELEVE", "IMPORTANT", "MAJEUR"]
      action: "RELAIS PREOPERATOIRE"
      jour: "J-3"
      note: |
        Réaliser un relais pré-procédural par HBPM à dose curative : première injection le soir de J-3 ; dernière injection au plus tard le matin de J-1 ; pas de contrôle anti-Xa systématique le matin de l’intervention.

    - if:
        indication_avk: "MTEV"
        mtev_complexe: false
        mtev_haut_risque: false
        r_hem: ["ELEVE", "IMPORTANT", "MAJEUR"]
      action: "PAS DE RELAIS"
      jour: ""
      note: |
        Ne pas réaliser de relais héparinique pré-procédural.

    - if:
        indication_avk: "MTEV"
        reprise_avk_24h: true
      action: "REPRISE AVK"
      jour: "J0 / J1"
      note: |
        Reprendre l’AVK dans les 24 premières heures à la posologie habituelle, sans dose de charge.

 
    # RELAIS CURATIF POST OPE et EP/TVP proximale < 3 mois ou déficit en protéine C/S

    - if:
        indication_avk: "MTEV"
        mtev_complexe: false
        mtev_haut_risque: true
      action: "RELAIS POSTOPERATOIRE"
      jour: "H48-H72"
      note: |
        Réaliser un relais postopératoire par héparine à dose curative, HBPM de préférence à HNF, débuté idéalement 48 à 72 h après la procédure. Arrêter l’héparine dès le premier INR ≥ 2.


    # Déficit en protéine C ou S et ça exclu < 3 mois pour éviter un doublon
    - if:
        indication_avk: "MTEV"
        mtev_complexe: false
        mtev_haut_risque: false
        deficit_proteine_c_s: true
      action: "RELAIS POSTOPERATOIRE"
      jour: "H48-H72"
      note: |
        Réaliser un relais postopératoire par héparine à dose curative, HBPM de préférence à HNF, débuté idéalement 48 à 72 h après la procédure. Arrêter l’héparine dès le premier INR ≥ 2.





    - if:
        indication_avk: "MTEV"
        mtev_complexe: false
        mtev_haut_risque: false
        deficit_proteine_c_s: false
        reprise_avk_24h: true
      action: "PAS DE RELAIS POSTOPERATOIRE"
      jour: ""
      note: |
        Ne pas réaliser de relais héparinique curatif postopératoire.



    # ===================================
    # ADAPTATION DU RELAIS EN FCT DU DFG
    # ========================================


    # DFG > 30
    - if:
        relais_avk: true
        dfg_relais_avk: "DFG > 30"
        schema_hbpm: "2 injections par jour (Enoxaparine 100 UI/kg toutes les 12h)"
      action: "RELAIS HBPM"
      jour: "J-3"
      note: |
        2 injections par jour (Enoxaparine 100 UI/kg toutes les 12h) avec 1ère injection le soir de J-3 et dernière injection au plus tard le matin de J-1.


    - if:
        relais_avk: true
        dfg_relais_avk: "DFG > 30"
        schema_hbpm: "1 injection par jour (Tinzaparine 175 UI/kg x 1/j)"
      action: "RELAIS HBPM"
      jour: "J-3"
      note: |
        1 injection par jour (Tinzaparine 175 UI/kg x 1/j), alors 1ère injection le soir de J-3 et dernière injection le soir de J-2.


    # DFG < 30 + HOSPITALISATION PREVUE
    - if:
        relais_avk: true
        dfg_relais_avk: ["15 ≤ DFG < 30", "DFG < 15"]
        mode_prise_en_charge_relais: "Hospitalisation prévue"
      action: "ADAPTATION RELAIS"
      jour: "J-3"
      note: |
        Choix recommandé : HNF IVSE curative débutée le soir de J-3 et arrêtée 6 h avant la procédure. Surveillance et adaptation selon le protocole habituel. Proposition : selon protocole local ou posologie de 12 à 15 UI/kg/h max, puis 1ère activité anti-Xa à H6 et adaptation posologique selon le protocole d’ajustement local.



    # DFG < 30 + PRISE EN CHARGE EXTRAHOSPITALIERE + HNF CALCIQUE SC
    - if:
        relais_avk: true
        dfg_relais_avk: ["15 ≤ DFG < 30", "DFG < 15"]
        mode_prise_en_charge_relais: "Prise en charge extrahospitalière"
        type_heparine_relais: "HNF calcique SC"
      action: "HNF CALCIQUE SC"
      jour: "J-3"
      note: |
        HNF calcique : 333 UI/kg SC le soir de J-3, puis 250 UI/kg toutes les 12 h ; dernière injection le matin de J-1.




    # DFG 15-29 + PRISE EN CHARGE EXTRAHOSPITALIERE + HBPM
    - if:
        relais_avk: true
        dfg_relais_avk: "15 ≤ DFG < 30"
        mode_prise_en_charge_relais: "Prise en charge extrahospitalière"
        type_heparine_relais: "HBPM"
      action: "ADAPTATION RELAIS"
      jour: "J-3"
      note: |
        Tinzaparine 175 UI/kg x1/j OU enoxaparine 100 UI/kg x1/j ; première injection soir J-3 ; dernière injection soir J-2 ; aucune HBPM à J-1.



# DFG < 15 + PRISE EN CHARGE EXTRAHOSPITALIERE + HBPM
    - if:
        relais_avk: true
        dfg_relais_avk: "DFG < 15"
        mode_prise_en_charge_relais: "Prise en charge extrahospitalière"
        type_heparine_relais: "HBPM"
      action: "ADAPTATION RELAIS"
      jour: "J-3"
      note: |
        Si option HBPM choisie : tinzaparine 175 UI/kg x1/j, soir J-3 puis soir J-2 ; pas d’HBPM à  J-1. Les autres HBPM ne sont pas recommandées.


    - if:
        relais_avk: true
        dfg_relais_avk: "DFG inconnu"
      action: "INFO"
      jour: ""
      note: |
        DFG inconnu : vérifier la fonction rénale avant de choisir le schéma de relais AVK.




    - if:
        relais_postop_indique: true
        dfg_relais_avk: "15 ≤ DFG < 30"
      action: "ADAPTATION RELAIS POSTOPERATOIRE"
      jour: "H48-H72"
      note: |
        Débuter idéalement 48 à 72 h après la procédure. HNF curative = choix recommandé.
        Alternatives possibles : tinzaparine 175 UI/kg x1/j ou enoxaparine 100 UI/kg x1/j.



    - if:
        relais_postop_indique: true
        dfg_relais_avk: "DFG < 15"
      action: "ADAPTATION RELAIS POSTOPERATOIRE"
      jour: "H48-H72"
      note: |
        Débuter idéalement 48 à 72 h après la procédure. HNF curative = choix recommandé.
        La tinzaparine 175 UI/kg x1/j peut être utilisée en alternative avec contrôle anti-Xa 4 à 6 h  après la 3e injection ; si anti-Xa > 1,5 UI/ml, demander un avis spécialisé.









    # =========================================================
    # ADAPTATION DU RELAIS EN FCT DU POIDS
    # =========================================================
    # SI POIDS >= 100 KG + DFG > 30
    - if:
        relais_avk: true
        poids_ge_100: true
        dfg_relais_avk: "DFG > 30"
      action: "ADAPTATION RELAIS"
      jour: ""
      note: |
        Poids ≥ 100 kg : privilégier une HBPM curative en première intention.
        Ne pas augmenter la dose au-delà de la dose recommandée pour 100 kg.
        Exemples de plafonds : tinzaparine/daltéparine/nadroparine 18 000 UI x1/j ; enoxaparine 10 000 UI x2/j.
        Pas de surveillance biologique systématique des HBPM.


    #100 KG+ HNF IVSE CHOISIE 

    - if:
        relais_avk: true
        poids_ge_100: true
        hnf_ivse_choisie: true
      action: "ADAPTATION HNF IVSE"
      jour: ""
      note: |
        Utiliser une dose initiale réduite par rapport au schéma strictement pondéral ; exemple : 1500 UI/h (36 000 UI/j), puis adapter selon la surveillance biologique habituelle.




     # SI POIDS >= 100 KG + DFG < 30 
    - if:
        relais_avk: true
        poids_ge_100: true
        dfg_relais_avk: ["15 ≤ DFG < 30", "DFG < 15"]
      action: "ADAPTATION RELAIS"
      jour: ""
      note: |
        Poids ≥ 100 kg et DFG < 30 : si une HBPM est retenue, ne pas augmenter la dose au-delà de la dose recommandée pour 100 kg.



    - if:
        relais_avk: true
        poids_inf_50: true
      action: "ADAPTATION RELAIS"
      jour: ""
      note: |
        Privilégier une HBPM curative en première intention, avec dose ajustée au poids corporel selon le RCP. HNF en seconde intention.



    - if:
        relais_avk: true
        poids_extreme_et_dfg_inf_30: true
      action: "VALIDATION MEDICALE"
      jour: ""
      note: |
        Situation combinée : validation médicale du schéma héparinique requise.




    # =========================================================
    # REPRISE POST OP
    # =========================================================

    - if:
        r_hem: ["ELEVE", "IMPORTANT", "MAJEUR"]
        reprise_avk_24h: true
      action: "REPRISE AVK"
      jour: "J0 / J1"
      note: |
        Reprendre dans les 24 premières heures à la posologie habituelle sans dose de charge, sauf règle spécifique explicitement contraire.


    - if:
        relais_postop_indique: true
      action: "RELAIS POSTOPERATOIRE"
      jour: "H48-H72"
      note: |
        Réaliser une anticoagulation postopératoire par héparine à dose curative, à débuter idéalement 48 à 72 h après la procédure.

    - if:
        relais_postop_indique: true
        inr_ge_2_postop: true
      action: "ARRET HEPARINE"
      jour: ""
      note: |
        Arrêter l’héparine dès le premier INR ≥ 2.




    - if:
        chevauchement_non_acceptable: true
      action: "DECISION MEDICALE"
      jour: ""
      note: |
        Le médecin peut décider de différer de quelques jours la reprise des AVK après le début des héparines.
        Ne pas automatiser le délai.


    - if:
        anticoag_curative_non_reprise: true
        thromboprophylaxie_indiquee: true
      action: "THROMBOPROPHYLAXIE"
      jour: ""
      note: |
        Réaliser la thromboprophylaxie postopératoire selon les indications et modalités habituelles.
        L’interrompre lorsque l’anticoagulation devient curative.




    # =========================================================
    # PAR DEFAUT
    # =========================================================


    - if:
        indication_avk: "AUTRE"
      action: "AVIS_SPECIALISE"
      jour: ""
      note: |
        Indication d’AVK non prévue par les branches FA / valve mécanique / MTEV / LVAD.




