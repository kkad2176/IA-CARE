- categorie: AOD
  source_ref: regle_6_aod
  atc_prefix: ["B01AE", "B01AF"]
  conditions:

    # ===== PROCÉDURE À RISQUE HÉMORRAGIQUE TRÈS ÉLEVÉ =====
    # Neurochirurgie / ALR neuraxiale

    - if:
        type_chir_neuro: "NEUROCHIR_INTRACRANIENNE"
        dfg_inf_30: true
      action: ARRET
      jour: J-5
      note: |
        Pour tous les AOD : si DFG < 30 alors dernière prise J-5 et dosage pré opératoire (car risque hémorragique très élevé).

        <i>Si EP ou TVP proximale < 1 mois ou ayant récidivée sous traitement ou précocement à l’arrêt de celui-ci, si SAPL, si hypertension pulmonaire thrombo-embolique chronique, si histoire clinique / familiale inhabituelle (déficit AT, sd paranéoplasique thrombogène), TIH en cours de traitement alors discussion multidisciplinaire pour stratégie personnalisée</i>

    - if:
        type_chir_neuro: "NEUROCHIR_INTRACRANIENNE"
        dfg_connu: false
      action: ARRET
      jour: J-5
      note: |
     
        Pour tous les AOD : dernière prise J-5 et dosage pré opératoire (car risque hémorragique très élevé).
         Si DFG < 30 alors dernière prise J-5 et dosage pré opératoire (car risque hémorragique très élevé).

        <i>Si EP ou TVP proximale < 1 mois ou ayant récidivée sous traitement ou précocement à l’arrêt de celui-ci, si SAPL, si hypertension pulmonaire thrombo-embolique chronique, si histoire clinique / familiale inhabituelle (déficit AT, sd paranéoplasique thrombogène), TIH en cours de traitement alors discussion multidisciplinaire pour stratégie personnalisée</i>

    - if:
        type_chir_neuro: "NEUROCHIR_INTRACRANIENNE"
      action: ARRET
      jour: J-5
      note: |
        Pour tous les AOD : dernière prise J-5. 


        <i>Si EP ou TVP proximale < 1 mois ou ayant récidivée sous traitement ou précocement à l’arrêt de celui-ci, si SAPL, si hypertension pulmonaire thrombo-embolique chronique, si histoire clinique / familiale inhabituelle (déficit AT, sd paranéoplasique thrombogène), TIH en cours de traitement alors discussion multidisciplinaire pour stratégie personnalisée</i>


    - if:
        alr: "NEURAXIAL"
        dfg_inf_30: true
      action: ARRET
      jour: J-5
      note: |
        Pour tous les AOD : si DFG < 30 alors dernière prise J-5 et dosage pré opératoire (car risque hémorragique très élevé).

        <i>Si EP ou TVP proximale < 1 mois ou ayant récidivée sous traitement ou précocement à l’arrêt de celui-ci, si SAPL, si hypertension pulmonaire thrombo-embolique chronique, si histoire clinique / familiale inhabituelle (déficit AT, sd paranéoplasique thrombogène), TIH en cours de traitement alors discussion multidisciplinaire pour stratégie personnalisée</i>


    - if:
        alr: "NEURAXIAL"
      action: ARRET
      jour: J-5
      note: |
        Pour tous les AOD : dernière prise J-5. 

        <i>Si EP ou TVP proximale < 1 mois ou ayant récidivée sous traitement ou précocement à l’arrêt de celui-ci, si SAPL, si hypertension pulmonaire thrombo-embolique chronique, si histoire clinique / familiale inhabituelle (déficit AT, sd paranéoplasique thrombogène), TIH en cours de traitement alors discussion multidisciplinaire pour stratégie personnalisée</i>



    # ===== PROCÉDURE À FAIBLE RISQUE HÉMORRAGIQUE =====

    - if:
        r_hem: ["FAIBLE", "NUL"]
      action: ARRET
      jour: J-1 
      note: |
        Procédure à faible risque hémorragique alors pas de prise la veille au soir ni le matin de l’intervention (quelque soit le DFG).

        <i>Si EP ou TVP proximale < 1 mois ou ayant récidivée sous traitement ou précocement à l’arrêt de celui-ci, si SAPL, si hypertension pulmonaire thrombo-embolique chronique, si histoire clinique / familiale inhabituelle (déficit AT, sd paranéoplasique thrombogène), TIH en cours de traitement alors discussion multidisciplinaire pour stratégie personnalisée</i>



    # ===== PROCÉDURE À RISQUE HÉMORRAGIQUE ÉLEVÉ ===
    # Apixaban, rivaroxaban, edoxaban

    - if:
        atc_prefix: ["B01AF"]
        dfg_ge_30: true
        r_hem: ["ELEVE", "IMPORTANT", "MAJEUR"]
      action: ARRET
      jour: J-3
      note: |
        Apixaban, rivaroxaban, edoxaban : si DFG >= 30 alors dernière prise J-3.

        <i>Si EP ou TVP proximale < 1 mois ou ayant récidivée sous traitement ou précocement à l’arrêt de celui-ci, si SAPL, si hypertension pulmonaire thrombo-embolique chronique, si histoire clinique / familiale inhabituelle (déficit AT, sd paranéoplasique thrombogène), TIH en cours de traitement alors discussion multidisciplinaire pour stratégie personnalisée</i>


    - if:
        atc_prefix: ["B01AF"]
        dfg_inf_30: true
        r_hem: ["ELEVE", "IMPORTANT", "MAJEUR"]
      action: ARRET
      jour: J-5
      note: |
        Apixaban, rivaroxaban, edoxaban : si DFG < 30 alors dernière prise J-5 sans relais ni dosage.

        <i>Si EP ou TVP proximale < 1 mois ou ayant récidivée sous traitement ou précocement à l’arrêt de celui-ci, si SAPL, si hypertension pulmonaire thrombo-embolique chronique, si histoire clinique / familiale inhabituelle (déficit AT, sd paranéoplasique thrombogène), TIH en cours de traitement alors discussion multidisciplinaire pour stratégie personnalisée</i>



    # Dabigatran

    - if:
        atc_codes: ["B01AE07"]
        dfg_ge_50: true
        r_hem: ["ELEVE", "IMPORTANT", "MAJEUR"]
      action: ARRET
      jour: J-3
      note: |
        Dabigatran : si DFG > 50 alors dernière prise J-3.

        <i>Si EP ou TVP proximale < 1 mois ou ayant récidivée sous traitement ou précocement à l’arrêt de celui-ci, si SAPL, si hypertension pulmonaire thrombo-embolique chronique, si histoire clinique / familiale inhabituelle (déficit AT, sd paranéoplasique thrombogène), TIH en cours de traitement alors discussion multidisciplinaire pour stratégie personnalisée</i>


    - if:
        atc_codes: ["B01AE07"]
        dfg_30_49: true
        r_hem: ["ELEVE", "IMPORTANT", "MAJEUR"]
      action: ARRET
      jour: J-5
      note: |
        Dabigatran : si DFG 30 - 50 alors dernière prise J-5 sans relai ni dosage.
        Dabigatran pas recommandé si DFG < 30.

        <i>Si EP ou TVP proximale < 1 mois ou ayant récidivée sous traitement ou précocement à l’arrêt de celui-ci, si SAPL, si hypertension pulmonaire thrombo-embolique chronique, si histoire clinique / familiale inhabituelle (déficit AT, sd paranéoplasique thrombogène), TIH en cours de traitement alors discussion multidisciplinaire pour stratégie personnalisée</i>



    # ===== DFG NON CONNU ========+

    - if:
        dfg_connu: false
      action: INFO
      note: |
        DFG inconnu. Vérifier le DFG avant application de la règle AOD.


    # ===== SÉCURITÉ PAR DÉFAUT =====

    - default: true
      action: DOSAGE
      note: |
        Cas complexe : vérifier le DFG et envisager un dosage.

