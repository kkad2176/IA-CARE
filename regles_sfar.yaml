        atc_codes: ["B01AE07"]
        dfg_30_49: true
        r_hem: ["ELEVE", "IMPORTANT", "MAJEUR"]
      action: ARRET
      jour: J-5
      note: |
        Dabigatran : si DFG 30 - 50 alors dernière prise J-5 sans relai ni dosage.
        Dabigatran pas recommandé si DFG < 30.

        <i>Si EP ou TVP proximale < 1 mois ou ayant récidivée sous traitement ou précocement à l’arrêt de celui-ci, si SAPL, si hypertension pulmonaire thrombo-embolique chronique, si histoire clinique / familiale inhabituelle (déficit AT, sd paranéoplasique thrombogène), TIH en cours de traitement alors discussion multidisciplinaire pour stratégie personnalisée</i>



    # ===== DFG NON CONNU ========+

    - if:
        dfg_connu: false
      action: INFO
      note: |
        DFG inconnu. Vérifier le DFG avant application de la règle AOD.


    # ===== SÉCURITÉ PAR DÉFAUT =====

    - default: true
      action: DOSAGE
      note: |
        Cas complexe : vérifier le DFG et envisager un dosage.

#-----------------------------

